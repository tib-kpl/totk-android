name: CI

# One pipeline: on a push to main the signed release APK is built and published as a GitHub release first; the
# source regression tests then run (on every push and pull request, but not after a failed release).
# The signing key is the RELEASE_KEY_PEM_B64 repository secret (base64 of a PEM private key + certificate).
# Keep that key: every later APK must be signed with it or Android refuses the update.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    needs: release
    # after a successful release; on pull requests the release is skipped (not failed), and the tests still run
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.release.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: games/totk/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the C test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan-dev
      - name: Install build-tool test dependencies
        run: python -m pip install -r games/totk/requirements.txt
      - name: Run synthetic container, update and native path tests
        run: python -m unittest discover -s tests -v
      # UBSan only (an AddressSanitizer build of this test hung on macOS 26, where these checks first ran).
      - name: Check native path parser with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_romfs_paths.c -o "$RUNNER_TEMP/test-romfs-paths"
          "$RUNNER_TEMP/test-romfs-paths"
      - name: Check the controller layout parser with the undefined-behavior sanitizer
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/test_controller_map.c -o "$RUNNER_TEMP/test-controller-map"
          "$RUNNER_TEMP/test-controller-map"
      - name: Check the Android dual-screen companion's game-state reader with the undefined-behavior sanitizer
        run: |
          cc -std=gnu11 -Wall -Wextra -Werror -D_GNU_SOURCE -DTOTK_GAME_V143=1 -Igames/totk/runtime -fsanitize=undefined -fno-sanitize-recover=all \
            games/totk/tests/companion/test_companion.c games/totk/runtime/companion_snapshot.c games/totk/runtime/companion_actions.c -o "$RUNNER_TEMP/test-companion" -lm -lpthread
          "$RUNNER_TEMP/test-companion"

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 150
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pin the .NET 10 SDK (the runner also has a newer one, which the translator build refuses)
        run: echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature"}}' > global.json
      - name: Install Python dependencies
        run: python -m pip install cryptography==50.0.2
      - name: Install the Android platform, build-tools and NDK r28
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Restore the Turnip driver cache
        id: turnip-cache
        uses: actions/cache@v4
        with:
          path: games/totk/build/turnip/packages/release/driver.so
          key: turnip-${{ hashFiles('games/totk/android/turnip/**') }}
      - name: Build the Turnip driver
        if: steps.turnip-cache.outputs.cache-hit != 'true'
        # The recipe pins Ubuntu 26.04 build tools (bison, flex, m4, glslang, spirv-tools), so it runs in that
        # image; the paths are the same inside and outside so the driver is byte-identical.
        run: |
          docker run --rm -e TURNIP_VARIANTS=release -e ANDROID_NDK_HOME             -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$ANDROID_NDK_HOME:$ANDROID_NDK_HOME:ro"             -w "$GITHUB_WORKSPACE" ubuntu:26.04 bash -ec '
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates git python3 python3-venv python3-pip ninja-build pkg-config dpkg-dev xz-utils
              git config --global --add safe.directory "*"
              bash games/totk/android/turnip/build.sh'
          # the container ran as root: give the build folder back to the runner user
          sudo chown -R "$(id -u):$(id -g)" games/totk/build
      - name: Write the signing key
        env:
          KEY_B64: ${{ secrets.RELEASE_KEY_PEM_B64 }}
        run: |
          test -n "$KEY_B64" || { echo "RELEASE_KEY_PEM_B64 secret is missing" >&2; exit 1; }
          umask 077
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.pem"
      - name: Build the signed APK
        run: |
          python3 games/totk/android/build_release.py \
            --ndk "$ANDROID_NDK_HOME" \
            --turnip games/totk/build/turnip/packages/release/driver.so \
            --key "$RUNNER_TEMP/release.pem" \
            --version-code $((20000 + GITHUB_RUN_NUMBER)) \
            -o "$RUNNER_TEMP/totk-native.apk"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          SHORT="${GITHUB_SHA::7}"
          ASSET="totk-native-${TAG}-${SHORT}.apk"
          cp "$RUNNER_TEMP/totk-native.apk" "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          git log -1 --format=%B "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$ASSET" "$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TotK Native ${TAG} (${SHORT})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease=false \
            --latest
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.pem"
